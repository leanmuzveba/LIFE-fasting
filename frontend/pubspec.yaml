name: life_fasting
description: "Calm, offline-first intermittent fasting tracker"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  intl: ^0.20.3
  path: ^1.9.1
  sqflite: ^2.4.4
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#F5FBFE"
  adaptive_icon_foreground: assets/icon/foreground.png
  remove_alpha_ios: true

# The app is light-only: android/app/src/main/res has no *-night folders, so
# the splash and window background stay light in system dark mode. If you
# re-run flutter_native_splash, delete the generated *-night folders again.
flutter_native_splash:
  color: "#F5FBFE"
  image: assets/icon/splash.png
  android_12:
    color: "#F5FBFE"
    image: assets/icon/splash.png
