name: life_fasting
description: "RUVA — personal fasting, nutrition and wellness hub"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  mobile_scanner: ^7.4.2
  path: ^1.9.1
  pedometer: ^4.2.0
  permission_handler: ^13.0.2
  sqflite: ^2.4.4
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/brand/splash/
    - assets/foods/
  # RUVA brand fonts (SIL OFL; licences in assets/fonts/OFL-*.txt)
  fonts:
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-500.ttf
          weight: 500
        - asset: assets/fonts/Lexend-600.ttf
          weight: 600
        - asset: assets/fonts/Lexend-700.ttf
          weight: 700
        - asset: assets/fonts/Lexend-800.ttf
          weight: 800
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-400.ttf
          weight: 400
        - asset: assets/fonts/DMSans-500.ttf
          weight: 500
        - asset: assets/fonts/DMSans-600.ttf
          weight: 600
        - asset: assets/fonts/DMSans-700.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-500.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-600.ttf
          weight: 600

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#135D44"
  adaptive_icon_foreground: assets/icon/foreground.png
  remove_alpha_ios: true

# The app is light-only: android/app/src/main/res has no *-night folders, so
# the splash and window background stay light in system dark mode. If you
# re-run flutter_native_splash, delete the generated *-night folders again.

flutter_native_splash:
  # Plain cream so the in-app animated splash (same colour) starts seamlessly.
  color: "#FAFFDE"
  android_12:
    color: "#FAFFDE"
    image: assets/icon/blank.png
